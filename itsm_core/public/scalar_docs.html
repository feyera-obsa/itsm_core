<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>itsm_core API Documentation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: white;
      padding: 1.5rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header .badge {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #93c5fd;
    }
    .header .links {
      display: flex;
      gap: 1rem;
    }
    .header .links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .header .links a:hover {
      color: white;
      background: rgba(255,255,255,0.1);
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    .scalar-container {
      min-height: calc(100vh - 120px);
    }
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
      .header .links {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>
        📋 itsm_core API Documentation
        <span class="badge">v1.0.0</span>
      </h1>
      <div class="links">
        <a href="/desk" target="_blank">ERPNext Desk</a>
        <a href="/api/method/itsm_core.api.heartbeat" target="_blank">Health Check</a>
        <a href="openapi.json" target="_blank">Raw OpenAPI JSON</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="scalar-container" id="scalar-api-reference"></div>
  </main>

  <script
    id="api-reference"
    type="application/json"
    data-url="./openapi.json"
    data-configuration='{"theme": "deepSpace", "layout": "modern", "hideDownloadButton": false, "hideModels": false, "defaultHttpClient": { "targetKey": "javascript", "clientKey": "fetch" }, "authentication": { "preferredSecurityScheme": "ApiTokenAuth" }}'
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest"></script>
</body>
</html>
