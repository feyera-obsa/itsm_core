<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>itsm_core API Documentation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <style>
    :root {
      --scalar-custom-header-height: 52px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      height: var(--scalar-custom-header-height);
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: white;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .topbar h1 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .topbar .badge { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; color: #93c5fd; }
    .topbar .links { display: flex; gap: 0.75rem; }
    .topbar .links a { color: #94a3b8; text-decoration: none; font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 4px; transition: all 0.15s; }
    .topbar .links a:hover { color: white; background: rgba(255,255,255,0.1); }
    #app { width: 100%; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>📋 itsm_core API Documentation <span class="badge">v1.0.0</span></h1>
    <div class="links">
      <a href="/desk" target="_blank">ERPNext Desk</a>
      <a href="/api/method/itsm_core.api.heartbeat" target="_blank">Health Check</a>
      <a href="/assets/itsm_core/openapi.json" target="_blank">Raw OpenAPI JSON</a>
    </div>
  </header>
  <div id="app"></div>
  <noscript>
    <p style="padding: 2rem; text-align: center; color: #64748b;">
      JavaScript is required to view the interactive API documentation.
      <br><a href="/assets/itsm_core/openapi.json" style="color: #3b82f6;">View Raw OpenAPI JSON</a>
    </p>
  </noscript>
  <script src="/assets/itsm_core/vendor/scalar-api-reference.umd.js"></script>
  <script>
    Scalar.createApiReference('#app', {
      url: '/assets/itsm_core/openapi.json',
      servers: [{ url: window.location.origin, description: 'This site' }],
      configuration: {
        theme: 'deepSpace',
        layout: 'modern',
        hideDownloadButton: false,
        hideModels: false,
        defaultHttpClient: { targetKey: 'javascript', clientKey: 'fetch' },
        authentication: { preferredSecurityScheme: 'ApiTokenAuth' },
        showDeveloperTools: 'never',
        agent: { disabled: true },
        mcp: { disabled: true },
        telemetry: false,
      }
    });
  </script>
</body>
</html>
